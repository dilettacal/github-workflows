name: Request release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable X.Y.Z release version (no leading v)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: dilettacal/github-workflows/.github/workflows/publish-release.yml@<pinned-sha>
    with:
      release-version: ${{ inputs.release-version }}
