name: Publish release

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable X.Y.Z release version without v.
        required: true
        type: string
  workflow_call:
    inputs:
      release-version:
        description: Stable X.Y.Z release version without v.
        required: true
        type: string
      workflows-ref:
        description: The github-workflows SHA this caller pins in `uses:`. Callers must set it.
        required: false
        type: string
    outputs:
      release-url:
        description: URL of the created or existing GitHub Release.
        value: ${{ jobs.publish-release.outputs.release-url }}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-release:
    name: Publish requested release
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      release-url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: test "$CURRENT_BRANCH" = "$DEFAULT_BRANCH"
      - name: Check out this workflow revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dilettacal/github-workflows
          # github.workflow_sha is the caller's commit inside workflow_call.
          ref: ${{ inputs.workflows-ref || github.workflow_sha }}
          path: .shared-workflows
      - name: Capture release date
        id: date
        run: echo "utc=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Record starting commit and reject existing publication
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "v$RELEASE_VERSION")
            subject=$(git show -s --format=%s "$tag_commit")
            expected="chore(release): $RELEASE_VERSION"
            if [ "$tag_commit" != "$(git rev-parse HEAD)" ] || { [ "$subject" != "$expected" ] && [ "${subject%% (#*}" != "$expected" ]; }; then
              echo '::error::Existing tag does not match this default-branch release commit; recover manually.'
              exit 1
            fi
            echo 'resuming=true' >> "$GITHUB_OUTPUT"
            gh release view "v$RELEASE_VERSION" --json url --jq '.url' 2>/dev/null | xargs -r -I{} echo "release-url={}" >> "$GITHUB_OUTPUT" || true
          elif subject=$(git show -s --format=%s HEAD) && { [ "$subject" = "chore(release): $RELEASE_VERSION" ] || [ "${subject%% (#*}" = "chore(release): $RELEASE_VERSION" ]; }; then
            python3 .shared-workflows/scripts/release.py validate-prepared --version "$RELEASE_VERSION"
            echo 'resuming=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release inputs and source files
        if: ${{ !steps.state.outputs.resuming }}
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: python3 .shared-workflows/scripts/release.py validate --version "$RELEASE_VERSION"
      - name: Roll changelog into requested release
        if: ${{ !steps.state.outputs.resuming }}
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_DATE: ${{ steps.date.outputs.utc }}
        run: python3 .shared-workflows/scripts/release.py rollover --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
      - name: Update project version and commit release
        if: ${{ !steps.state.outputs.resuming }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          STARTING_COMMIT: ${{ steps.state.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STARTING_COMMIT"
          VERSION_FILE=$(python3 .shared-workflows/scripts/release.py update-version --version "$RELEASE_VERSION")
          git diff --check
          git add CHANGELOG.md "$VERSION_FILE"
          git diff --cached --quiet && { echo '::error::No release changes to commit'; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "chore(release): $RELEASE_VERSION"
          branch="release/v$RELEASE_VERSION"
          remote_commit=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -n "$remote_commit" ]; then
            test "$remote_commit" = "$(git rev-parse HEAD)"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          gh pr list --head "$branch" --state open --json url --jq '.[0].url' | grep -q . || \
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "chore(release): $RELEASE_VERSION" --body 'Prepared release; review and merge before publishing the tag.'
      - name: Create GitHub Release from changelog notes
        if: ${{ steps.state.outputs.resuming }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          EXISTING_URL: ${{ steps.state.outputs.release-url }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_URL" ]; then
            echo "url=$EXISTING_URL" >> "$GITHUB_OUTPUT"
          else
            git tag "v$RELEASE_VERSION"
            git push origin "v$RELEASE_VERSION"
            python3 .shared-workflows/scripts/release.py release-notes --version "$RELEASE_VERSION" > release-notes.md
            gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --notes-file release-notes.md
            gh release view "v$RELEASE_VERSION" --json url --jq '.url' | xargs -I{} echo "url={}" >> "$GITHUB_OUTPUT"
          fi
